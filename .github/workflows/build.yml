name: build-android-llama
on:
  workflow_dispatch:
    inputs:
      llamasharp_ref:
        description: "Тег LLamaSharp (откуда взять нужный коммит llama.cpp)"
        default: "v0.30.0"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Клонируем LLamaSharp вместе с llama.cpp нужной версии
        run: |
          git clone --depth 1 --branch "${{ inputs.llamasharp_ref }}" \
            --recurse-submodules --shallow-submodules \
            https://github.com/SciSharp/LLamaSharp.git src
          cd src/llama.cpp && echo "llama.cpp commit:" && git log -1 --format=%H

      - name: Сборка под ARMv8.2 + dotprod (без i8mm)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cd src/llama.cpp
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16 \
            -DGGML_CPU_REPACK=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_BACKEND_DL=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TOOLS=OFF
          cmake --build build -j4
          mkdir -p ../../out
          find build -name "*.so" -exec cp {} ../../out/ \;
          "$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip ../../out/*.so
          ls -la ../../out

      - uses: actions/upload-artifact@v4
        with:
          name: android-so
          path: out/*.so
