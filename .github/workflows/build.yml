name: build-android-llama
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получаем LLamaSharp и определяем коммит llama.cpp
        run: |
          URL=https://github.com/SciSharp/LLamaSharp.git
          TAG=$(git ls-remote --tags "$URL" | grep -E 'refs/tags/[^/^]*0\.30\.0$' | head -1 | sed 's#.*refs/tags/##' || true)
          echo "Тег: '$TAG'"
          if [ -z "$TAG" ]; then
            echo "ТЕГ 0.30.0 НЕ НАЙДЕН. Последние теги:"
            git ls-remote --tags "$URL" | sed 's#.*refs/tags/##' | tail -20
            exit 1
          fi
          git clone --depth 1 --branch "$TAG" "$URL" lls
          ls -la lls
          echo "--- compile.yml: строки про llama.cpp ---"
          grep -n -i -E "ref:|repository:|llama.cpp" lls/.github/workflows/compile.yml | head -40 || true
          SHA=$(grep -E "ref:[[:space:]]*['\"]?[0-9a-f]{7,40}" lls/.github/workflows/compile.yml | head -1 | grep -oE "[0-9a-f]{7,40}" | head -1 || true)
          echo "Коммит llama.cpp: '$SHA'"
          if [ -z "$SHA" ]; then
            echo "КОММИТ НЕ НАЙДЕН — пришлите этот лог"
            exit 1
          fi
          git clone https://github.com/ggml-org/llama.cpp llama.cpp
          git -C llama.cpp checkout "$SHA"
          git -C llama.cpp log -1 --format=%H

      - name: Сборка под ARMv8.2 + dotprod (без i8mm)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd llama.cpp
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16 \
            -DGGML_CPU_REPACK=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_BACKEND_DL=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TOOLS=OFF
          cmake --build build -j4
          find build -name "*.so" -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          "$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip "$GITHUB_WORKSPACE"/out/*.so
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: android-so
          path: out/*.so
