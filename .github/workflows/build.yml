name: build-android-llama
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получаем LLamaSharp и определяем коммит llama.cpp
        run: |
          URL=https://github.com/SciSharp/LLamaSharp.git
          git clone --depth 1 --branch v0.30.0 "$URL" lls
          echo "--- .gitmodules ---"
          cat lls/.gitmodules
          SHA=$(git -C lls ls-tree HEAD llama.cpp | awk '{print $3}')
          echo "Коммит llama.cpp (из подмодуля LLamaSharp): '$SHA'"
          if [ -z "$SHA" ]; then echo "КОММИТ НЕ НАЙДЕН"; exit 1; fi
          mkdir llama.cpp
          cd llama.cpp
          git init -q
          git remote add origin https://github.com/ggml-org/llama.cpp
          git fetch --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD
          git log -1 --format='%H %cd %s'

      - name: Сборка под ARMv8.2 + dotprod (без i8mm)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          echo "NDK: $NDK"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd llama.cpp
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16 \
            -DGGML_CPU_REPACK=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_BACKEND_DL=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TOOLS=OFF
          cmake --build build --target llama ggml ggml-base ggml-cpu -j4
          find build -name "*.so" -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          "$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip "$GITHUB_WORKSPACE"/out/*.so
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: android-so
          path: out/*.so
